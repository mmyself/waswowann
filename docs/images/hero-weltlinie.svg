<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 292" width="920" height="292" role="img" aria-label="WasWoWann: Vergangenheit links von JETZT, Transformation und Zukunftsgraph rechts von JETZT">
  <defs>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#0f172a" />
    </marker>
    <marker id="arr-warn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#d97706" />
    </marker>
    <marker id="arr-ok" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#059669" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Outer card -->
  <rect x="1" y="1" width="918" height="290" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Past & Future backdrop regions -->
  <rect x="16" y="16" width="248" height="242" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <rect x="282" y="16" width="622" height="242" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />

  <text x="140" y="38" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#1e40af">VERGANGENHEIT (Beobachtet)</text>
  <text x="593" y="38" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#065f46">ZUKUNFT · Der Zukunftsgraph</text>

  <!-- JETZT Axis -->
  <line x1="273" y1="36" x2="273" y2="254" stroke="#0f172a" stroke-width="2" stroke-dasharray="5 4" opacity="0.65" />
  <rect x="241" y="10" width="64" height="22" rx="11" fill="#0f172a" />
  <text x="273" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">JETZT</text>

  <!-- Edges -->
  <path d="M 226 94 C 278 94, 296 132, 352 132" fill="none" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arr-dark)" />
  <rect x="242" y="88" width="84" height="21" rx="6" fill="#ffffff" stroke="#cbd5e1" />
  <text x="284" y="102" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">verbraucht</text>

  <path d="M 226 196 C 278 196, 296 156, 352 156" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arr-warn)" />
  <rect x="226" y="176" width="122" height="21" rx="6" fill="#ffffff" stroke="#d97706" />
  <text x="287" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">löst aus / schützt</text>

  <path d="M 526 144 L 574 144" fill="none" stroke="#059669" stroke-width="2.3" marker-end="url(#arr-ok)" />
  <text x="550" y="133" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">erzeugt</text>

  <path d="M 722 144 L 758 144" fill="none" stroke="#059669" stroke-width="2.1" stroke-dasharray="3 3" />
  <text x="740" y="133" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">prüft</text>

  <!-- Observed State 1 -->
  <rect x="28" y="56" width="198" height="76" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.2" />
  <text x="127" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Erste Pilzansätze</text>
  <text x="127" y="96" text-anchor="middle" font-size="11.5" fill="#475569">20 ± 5 g · Tag 0 · Box</text>
  <rect x="49" y="106" width="156" height="19" rx="9.5" fill="#eff6ff" stroke="#2563eb" stroke-width="1" />
  <text x="127" y="119" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">Weltlinie: Pilz (Ist)</text>

  <!-- Observed State 2 -->
  <rect x="28" y="158" width="198" height="76" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.2" />
  <text x="127" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Box-Klima</text>
  <text x="127" y="198" text-anchor="middle" font-size="11.5" fill="#475569">80 ± 10 % rF · 16 → 18 °C</text>
  <rect x="49" y="208" width="156" height="19" rx="9.5" fill="#eff6ff" stroke="#2563eb" stroke-width="1" />
  <text x="127" y="221" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">Weltlinie: Box (Ist)</text>

  <!-- Transformation -->
  <rect x="358" y="101" width="168" height="86" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 3" />
  <text x="442" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Pilz wächst</text>
  <text x="442" y="144" text-anchor="middle" font-size="11.5" fill="#475569">Dauer: ~8 ± 2 Tage</text>
  <text x="442" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Transformation (Plan)</text>

  <!-- Predicted State -->
  <rect x="578" y="101" width="144" height="86" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2.1" stroke-dasharray="6 3" />
  <text x="650" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Erwartet</text>
  <text x="650" y="144" text-anchor="middle" font-size="11.5" fill="#475569">280 ± 45 g</text>
  <text x="650" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">ca. Tag 8 (Prognose)</text>

  <!-- Desired Goal -->
  <rect x="758" y="95" width="136" height="98" rx="14" fill="none" stroke="#059669" stroke-width="1.5" opacity="0.65" />
  <rect x="764" y="101" width="124" height="86" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2.2" />
  <text x="826" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Dein Ziel</text>
  <text x="826" y="144" text-anchor="middle" font-size="11.5" fill="#475569">≥ 200 g Pilz</text>
  <text x="826" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">bis Tag 12 (Soll)</text>

  <!-- Legend footer -->
  <rect x="28" y="269" width="14" height="10" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="48" y="278" font-size="10.5" fill="#475569">Beobachtet (durchgezogen = Fakt)</text>

  <rect x="255" y="269" width="14" height="10" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="3 2" />
  <text x="275" y="278" font-size="10.5" fill="#475569">Plan / Prognose (gestrichelt = Schätzung)</text>

  <rect x="520" y="269" width="14" height="10" rx="2" fill="#ffffff" stroke="#059669" stroke-width="2" />
  <text x="540" y="278" font-size="10.5" fill="#475569">Ziel (doppelter Rahmen = feste Grenzen)</text>

  <line x1="752" y1="274" x2="770" y2="274" stroke="#d97706" stroke-width="2.2" stroke-dasharray="3 2" />
  <text x="776" y="278" font-size="10.5" fill="#475569">Wächter / Auslöser</text>
</svg>
