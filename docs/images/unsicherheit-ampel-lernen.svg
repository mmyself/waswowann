<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 246" width="920" height="246" role="img" aria-label="Spielregeln: Ehrliche Unsicherheit im Ziel-Korridor und Lernen aus echten Messungen">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <rect x="1" y="1" width="918" height="244" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Left Card: Traffic light corridor -->
  <rect x="18" y="18" width="434" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="36" y="42" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#2563eb">SPIELREGEL A · EHRLICHE UNSICHERHEIT &amp; AMPEL</text>
  <text x="36" y="64" font-size="16" font-weight="700" fill="#0f172a">Wolke statt Scheingenauigkeit</text>
  <text x="36" y="84" font-size="11.5" fill="#475569">Gemessen: 80 % ± 10 % Luftfeuchte · Ziel-Korridor: 60 % – 100 %</text>

  <!-- Corridor Bar (domain 35..105 across x=36..434 => width=398) -->
  <rect x="36" y="102" width="398" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <!-- [60..100] = left (25/70)*398=142 -> x=178, width=(40/70)*398=227 -->
  <rect x="178" y="102" width="227" height="36" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="4 3" />
  <!-- Uncertainty band 70..90 -> x=178+(10/70)*398=235, width=114 -->
  <rect x="235" y="110" width="114" height="20" rx="5" fill="#16a34a" opacity="0.32" />
  <rect x="290" y="106" width="4" height="28" rx="2" fill="#15803d" />
  <text x="292" y="153" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d">80 % ± 10 % · Trefferchance 95 %</text>

  <!-- Mini Ampel pills -->
  <rect x="36" y="170" width="122" height="40" rx="8" fill="#f0fdf4" stroke="#86efac" />
  <circle cx="52" cy="190" r="5" fill="#16a34a" />
  <text x="64" y="187" font-size="11" font-weight="700" fill="#166534">Grün (Stufe 2)</text>
  <text x="64" y="201" font-size="10" fill="#475569">P ≥ 80 % im Korridor</text>

  <rect x="168" y="170" width="132" height="40" rx="8" fill="#fefce8" stroke="#fde047" />
  <circle cx="184" cy="190" r="5" fill="#ca8a04" />
  <text x="196" y="187" font-size="11" font-weight="700" fill="#854d0e">Gelb (Stufe 3)</text>
  <text x="196" y="201" font-size="10" fill="#475569">Alternativzweig prüfen</text>

  <rect x="310" y="170" width="124" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5" />
  <circle cx="326" cy="190" r="5" fill="#dc2626" />
  <text x="338" y="187" font-size="11" font-weight="700" fill="#991b1b">Rot (Stufe 4)</text>
  <text x="338" y="201" font-size="10" fill="#475569">Grenze gerissen</text>

  <!-- Right Card: Learning ai_prior -> measured -->
  <rect x="468" y="18" width="434" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="486" y="42" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#7c3aed">SPIELREGEL B · LERNEN AUS MESSUNGEN</text>
  <text x="486" y="64" font-size="16" font-weight="700" fill="#0f172a">Aus Schätzung (AI-Prior) wird Erfahrung</text>
  <text x="486" y="84" font-size="11.5" fill="#475569">Ohne eigene Daten rechnet WasWoWann vorsichtig – ab Messung 1 scharf:</text>

  <!-- Track Before (Tag 4..13 across x=486..884 => width=398) -->
  <text x="486" y="107" font-size="11" font-weight="700" fill="#6d28d9">Vorher · Erste Schätzung (AI-Prior): 8,0 ± 2,0 Tage (Tag 6 bis Tag 10)</text>
  <rect x="486" y="114" width="398" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" />
  <!-- Tag 6..10 on [4..13] => left=(2/9)*398=88, width=(4/9)*398=177 -->
  <rect x="574" y="118" width="177" height="16" rx="4" fill="#7c3aed" opacity="0.28" />
  <rect x="661" y="116" width="4" height="20" rx="2" fill="#7c3aed" />

  <!-- Calibration Event -->
  <text x="685" y="156" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">↓ Echte Ernte gewogen &amp; gestoppt: 265 g nach 8,92 Tagen</text>

  <!-- Track After -->
  <text x="486" y="176" font-size="11" font-weight="700" fill="#059669">Nachher · Kalibriert (measured): 8,9 ± 0,1 Tage (Tag 8,8 bis Tag 9,0)</text>
  <rect x="486" y="183" width="398" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" />
  <!-- Tag 8.8..9.0 => left=(4.8/9)*398=212, width=14 -->
  <rect x="698" y="187" width="14" height="16" rx="4" fill="#059669" opacity="0.35" />
  <rect x="703" y="185" width="4" height="20" rx="2" fill="#059669" />

  <text x="486" y="220" font-size="9.5" fill="#64748b">Tag 4</text>
  <text x="618" y="220" font-size="9.5" fill="#64748b">Tag 7</text>
  <text x="751" y="220" font-size="9.5" fill="#64748b">Tag 10</text>
  <text x="858" y="220" font-size="9.5" fill="#64748b">Tag 13</text>
</svg>
